name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests -v

  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Python tests (system python3)
        run: python3 -m unittest discover tests
      - name: Build Morphine.app
        run: app/scripts/bundle.sh
      - name: Zip
        run: cd dist && ditto -c -k --keepParent Morphine.app Morphine.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Morphine-app
          path: dist/Morphine.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Morphine.zip
